<style>
:root{--a:#1b2548;--b:#3c4a7a;--h1:#2b3560;--h2:#222a52;--h3:#1a2044;--sun:#ffd84d;--orb:#fff;--ox:72%;--oy:16%;--ink:#eef2ff;

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:linear-gradient(180deg,var(--a),var(--b));overflow:hidden;position:relative;transition:color 1.5s}
body[data-phase=dawn]{--sun:#ffc27a;--a:#f6d8c4;--b:#c9d7ee;--h1:#b9a7c9;--h2:#9d93bd;--h3:#7f7fa8;--orb:#fff1c2;--ox:22%;--oy:52%;--ink:#3b3350}
body[data-phase=day]{--sun:#ffd84d;--a:#9fd3ea;--b:#eaf6f2;--h1:#a8cfae;--h2:#86b895;--h3:#6aa17f;--orb:#fff4c2;--ox:50%;--oy:12%;--ink:#1f3a3a}
body[data-phase=dusk]{--sun:#ff9d6e;--a:#f2b8a2;--b:#8b78b5;--h1:#8a6f9c;--h2:#6a5a8a;--h3:#4b4570;--orb:#ffd29a;--ox:80%;--oy:48%;--ink:#fff4ea}
body[data-phase=late]{--a:#0b1026;--b:#1e2750;--h1:#171d3d;--h2:#121732;--h3:#0d1126;--orb:#fff;--ox:30%;--oy:14%;--ink:#e8ecff}
.bg{position:fixed;inset:0;background:linear-gradient(180deg,var(--a),var(--b))}
#orb{position:fixed;width:min(24vmin,170px);height:min(24vmin,170px);left:var(--ox);top:var(--oy);transform:translate(-50%,-50%);fill:none;stroke:none;transition:left 3s,top 3s}#orb g{transition:opacity 2s}#moon{opacity:0}body[data-phase=night] #moon,body[data-phase=late] #moon{opacity:1}body[data-phase=night] #sun,body[data-phase=late] #sun{opacity:0}.sunc{fill:var(--sun)}.ray{stroke:var(--sun);stroke-width:7;stroke-linecap:round}.moonc{fill:#f6f1de}.crater{fill:#e6dfc4}#rays{transform-origin:100px 100px;animation:spin 90s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#stars{position:fixed;inset:0;opacity:0;transition:opacity 2s}
body[data-phase=night] #stars,body[data-phase=late] #stars{opacity:1}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
.mote{position:fixed;width:6px;height:6px;border-radius:50%;background:var(--orb);opacity:.5;animation:fl 14s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-28px)}}
#hills{position:fixed;left:0;right:0;bottom:0;width:100%;height:55vh}
#hills path{transition:fill 2s}
.glass{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.top{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;justify-content:space-between;padding:0 16px;z-index:3}
.pill{display:flex;align-items:center;border-radius:999px;padding:9px 16px;font-weight:600;font-size:.9rem;color:inherit}
.icons{display:flex;gap:8px}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:inherit;cursor:pointer;text-decoration:none;padding:0;font:inherit}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{position:fixed;left:0;right:0;top:15vh;margin:0;text-align:center;font:600 clamp(2.6rem,9vw,5.8rem)/1.02 var(--serif);letter-spacing:-.01em;padding:0 20px;z-index:1}
.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);width:min(560px,92vw);z-index:3}
.bar{border-radius:24px;padding:8px}
.bar iframe{display:block;width:100%;height:352px;border:0;border-radius:16px}
@media (max-height:599px){.bar iframe{height:152px}}
.modal{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:rgba(10,12,30,.4);backdrop-filter:blur(8px);padding:20px}
.modal.show{display:grid}
.card{width:min(380px,100%);border-radius:24px;padding:22px;text-align:center;color:#fff;background:rgba(30,34,70,.7)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.av{width:72px;height:72px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font:600 1.8rem var(--serif);background:linear-gradient(135deg,#b9a7f0,#7fd0e0);color:#1b2548}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){h1{top:11vh;font-size:clamp(2rem,7vw,3.6rem)}}

.dock{display:flex;flex-direction:column;align-items:center;gap:10px}
.pbar{width:100%;border-radius:24px;padding:14px;display:grid;grid-template-columns:64px 1fr;gap:6px 14px;align-items:center}
.art{width:64px;height:64px;border-radius:12px;background:rgba(255,255,255,.25) center/cover;grid-row:1/3}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.a{opacity:.7;font-size:.85rem}
.prog{grid-column:1/3;display:flex;align-items:center;gap:10px;font-size:.75rem;opacity:.9}
.trk{flex:1;height:6px;border-radius:3px;background:rgba(127,127,127,.35);cursor:pointer}.trk i{display:block;height:100%;width:0;border-radius:3px;background:var(--ink)}
.ctl{grid-column:1/3;display:flex;justify-content:center;align-items:center;gap:10px}
.ctl .ib{background:none;border:0;position:relative}.ctl .on{opacity:1;outline:2px solid var(--ink);outline-offset:-2px}.ctl .ib:not(.on):not(.play){opacity:.75}
.ctl .play{width:52px;height:52px;background:var(--ink);color:var(--b)}.ctl .play svg{fill:currentColor;stroke:none;width:22px;height:22px}
.ctl svg.f{fill:currentColor;stroke:none}
#rep.one::after{content:"1";position:absolute;font-size:.6rem;font-weight:700;right:6px;bottom:3px}
#emb{position:fixed;left:0;bottom:0;width:300px;height:80px;opacity:0;pointer-events:none;z-index:-1;overflow:hidden}
#emb iframe{opacity:0;pointer-events:none}
.card.lc{width:min(520px,100%);max-height:84vh;display:flex;flex-direction:column;text-align:left;min-height:0}
#q{width:100%;padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font:inherit;margin-bottom:10px}
#list{overflow:auto;flex:1;min-height:0;padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.38) transparent}
#list::-webkit-scrollbar{width:8px}
#list::-webkit-scrollbar-track{background:transparent;border-radius:999px;margin:4px 0}
#list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.38);border:2px solid transparent;background-clip:padding-box;border-radius:999px;min-height:34px}
#list::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.58);border:2px solid transparent;background-clip:padding-box}
.row{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.12)}.row.cur{background:rgba(255,255,255,.2)}
.row img,.row b{width:48px;height:48px;border-radius:8px;background:rgba(255,255,255,.18);object-fit:cover;align-self:start;margin-top:1px}
.rt{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ra{font-size:.76rem;line-height:1.2;margin-top:3px;opacity:.62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Creator card */
.creator-card{width:min(620px,100%);max-height:90vh;padding:28px 28px 26px;border-radius:28px;text-align:center;background:rgba(19,24,40,.78);border:1px solid rgba(255,255,255,.22);box-shadow:0 28px 80px rgba(0,0,0,.38);color:#fff}
.creator-head{position:relative;display:flex;align-items:center;justify-content:center;min-height:28px;font-size:.76rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;opacity:.78}.creator-head .heart{font-size:.95rem;letter-spacing:0;opacity:1}
.creator-close{position:absolute;right:-2px;top:-4px;width:34px;height:34px;padding:0;display:grid;place-items:center;background:none;border:0;color:#fff;cursor:pointer;opacity:.78;border-radius:50%}.creator-close:hover{background:rgba(255,255,255,.08);opacity:1}.creator-close svg{width:17px;height:17px;stroke-width:1.7}
.creator-inner{margin-top:24px;padding:42px 34px 38px;border:1px solid rgba(255,255,255,.20);border-radius:24px;background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.creator-name{font:600 clamp(2.1rem,6vw,3.35rem)/1 var(--serif);letter-spacing:-.02em;text-shadow:0 2px 18px rgba(255,255,255,.08)}

.creator-footer{margin-top:28px;padding-top:25px;border-top:1px solid rgba(255,255,255,.18);font-size:.72rem;letter-spacing:.18em;font-weight:600;opacity:.58}
@media (max-width:620px){.creator-card{padding:24px 18px 22px;border-radius:24px}.creator-inner{padding:34px 16px 30px;margin-top:20px}.creator-links{gap:10px}.creator-pill{width:100%;justify-content:center;padding:0 14px;font-size:.82rem}}

var Q=function(i){return document.getElementById(i)},idx=-1,ctl=null,shuf=false,rep="off",lock=0,hist=[],META={},durMs=0;
try{META=JSON.parse(localStorage.getItem("kq_meta")||"{}")}catch(e){}
function nm(i){var m=META[IDS[i]];return m&&m.t?m.t:"Track "+(i+1)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
var rt=0;function later(){clearTimeout(rt);rt=setTimeout(function(){render();show();try{localStorage.setItem("kq_meta",JSON.stringify(META))}catch(e){}},400)}
function render(){var q=Q("q").value.toLowerCase(),h="";
IDS.forEach(function(id,i){var m=META[id]||{};if(q&&nm(i).toLowerCase().indexOf(q)<0)return;
h+='<div class="row'+(i===idx?" cur":"")+'" data-i="'+i+'">'+(m.i?'<img loading="lazy" src="'+esc(m.i)+'" alt="">':"<b></b>")+'<div><div class="rt">'+esc(nm(i))+'</div>'+(m.a?'<div class="ra">'+esc(m.a)+'</div>':"")+'</div></div>'});
Q("list").innerHTML=h||'<p style="opacity:.7;padding:10px">No songs found.</p>';Q("lcnt").textContent="Masterpieces \u00b7 "+IDS.length+" songs"}
function show(){if(idx<0)return;Q("tt").textContent=nm(idx);var m=META[IDS[idx]];Q("art").style.backgroundImage=m&&m.i?"url("+m.i+")":""}
(function(){var k=0;function w(){if(k>=IDS.length)return;var id=IDS[k++];if(META[id]&&META[id].a)return w();
fetch("https://open.spotify.com/oembed?url="+encodeURIComponent("https://open.spotify.com/track/"+id)).then(function(r){return r.json()}).then(function(j){
META[id]=META[id]||{};META[id].t=j.title;META[id].i=j.thumbnail_url;
return fetch("https://itunes.apple.com/search?term="+encodeURIComponent(j.title)+"&entity=song&limit=8").then(function(r){return r.json()}).then(function(x){
var q=j.title.toLowerCase().replace(/[^a-z0-9]+/g," ").trim(),best=null,score=0;
(x.results||[]).forEach(function(v){var t=String(v.trackName||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim(),s=0;
if(t===q)s=100;else{q.split(" ").forEach(function(w){if(w.length>2&&t.indexOf(w)>=0)s++})}
if(s>score){score=s;best=v}});
if(best&&score>=Math.max(2,q.split(" ").length*.35))META[id].a=best.artistName||"";
}).catch(function(){}).then(function(){later()})
}).catch(function(){}).then(w)}
for(var n=0;n<6;n++)w()})();
render();
window.onSpotifyIframeApiReady=function(api){api.createController(Q("emb"),{width:"100%",height:80,uri:"spotify:track:"+IDS[0]},function(c){ctl=c;
c.addListener("playback_update",function(e){var d=e.data;Q("ppi").innerHTML=d.isPaused?'<path d="M8 5v14l11-7z"/>':'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
if(d.duration>0){durMs=d.duration;Q("fill").style.width=Math.min(100,d.position/d.duration*100)+"%";Q("pos").textContent=fmt(d.position);Q("dur").textContent=fmt(d.duration);
if(idx>=0&&Date.now()-lock>2500&&d.position>=d.duration-400){lock=Date.now();nxt(true)}}})})};
function play(i,back){if(!ctl||i<0||i>=IDS.length)return;if(idx>=0&&!back)hist.push(idx);idx=i;lock=Date.now();ctl.loadUri("spotify:track:"+IDS[i]);ctl.play();show();render()}
function rnd(){var i=Math.floor(Math.random()*IDS.length);if(i===idx&&IDS.length>1)i=(i+1)%IDS.length;return i}
function nxt(auto){if(auto&&rep==="one")return play(idx,true);
var i;if(shuf)i=rnd();else{i=idx+1;if(i>=IDS.length){if(rep==="all"||!auto)i=0;else return}}play(i)}
function prv(){if(hist.length)play(hist.pop(),true);else play(idx<=0?IDS.length-1:idx-1,true)}
Q("pp").onclick=function(){if(idx<0)play(shuf?rnd():0);else if(ctl)ctl.togglePlay()};
Q("next").onclick=function(){nxt(false)};Q("prev").onclick=prv;
Q("shuf").onclick=function(){shuf=!shuf;this.classList.toggle("on",shuf)};
Q("rep").onclick=function(){rep=rep==="off"?"all":rep==="all"?"one":"off";this.classList.toggle("on",rep!=="off");this.classList.toggle("one",rep==="one");this.title="Repeat: "+rep};
Q("trk").onclick=function(e){var b=this.getBoundingClientRect();if(ctl&&idx>=0&&durMs)ctl.seek(((e.clientX-b.left)/b.width)*durMs/1000)};
Q("list").onclick=function(e){var r=e.target.closest(".row");if(r){play(+r.dataset.i);Q("lm").classList.remove("show")}};
Q("q").oninput=render;Q("pl").onclick=function(){Q("lm").classList.add("show");Q("q").focus()};Q("lx").onclick=function(){Q("lm").classList.remove("show")};
Q("lm").onclick=function(e){if(e.target===this)this.classList.remove("show")};
document.addEventListener("keydown",function(e){if(e.key==="Escape")Q("lm").classList.remove("show")});
</script>
<div id="emb"></div>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body></html>
